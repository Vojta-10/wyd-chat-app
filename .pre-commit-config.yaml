repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.6
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
      files: ^wyd-backend/
    # Run the formatter.
    - id: ruff-format
      files: ^wyd-backend/
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    - id: gitleaks