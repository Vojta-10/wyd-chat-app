[project]
name = "wyd-backend"
version = "0.0.1"
description = "Backend for wyd-chat-app"
authors = [
    { name = "Vojtaskos58", email = "vojtasvojto@email.cz" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[tool.fastapi]
entrypoint = "app.main:app"
