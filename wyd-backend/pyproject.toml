[project]
name = "wyd-backend"
version = "0.1.0"
description = "Backend for wyd-chat-app"
authors = [
    { name = "Vojtaskos58", email = "vojtasvojto@email.cz" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.mypy]
python_version= "3.14"
plugins = ['pydantic.mypy']
strict = true
enable_error_code = ["ignore-without-code"]

[tool.ruff]
[tool.ruff.lint]
extend-select = ["B", "E", "T", "S"]
unfixable = ["S"]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/scripts/print_ddl.py" = ["T201"]
