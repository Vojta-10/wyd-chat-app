services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: tests
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: db_testing
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5